<body>
    <div class="game-container">
        <h2>♟ 自研 · 国际跳棋</h2>
        <div class="sub">10×10 百格 · 完整规则（含连吃、强制吃子、王棋）</div>

        <div class="board-wrapper">
            <div id="draughts-board"></div>
        </div>

        <div class="status-area">
            <span id="status-text">⚪ 白方走棋</span>
            <div class="btn-group">
                <button class="btn secondary" id="btn-reset">↻ 新游戏</button>
                <button class="btn" id="btn-flip">🔄 翻转棋盘</button>
            </div>
        </div>

        <div class="footnote">
            💡 点击己方棋子选中（绿色高亮），再点击高亮格子走棋。<br />
            🟢 绿色 = 普通走法 &nbsp;|&nbsp; 🟠 橙色 = 吃子走法（必须吃子）<br />
            「翻转棋盘」方便对面玩家观看，不影响对局。
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ---------- 常量与符号 ----------
            const SYMBOLS = {
                w: '⛀', // 白兵
                W: '⛁', // 白王
                b: '⛂', // 黑兵
                B: '⛃', // 黑王
            };

            // ---------- DOM 引用 ----------
            const boardEl = document.getElementById('draughts-board');
            const statusEl = document.getElementById('status-text');
            const btnReset = document.getElementById('btn-reset');
            const btnFlip = document.getElementById('btn-flip');

            // ---------- 游戏状态 ----------
            let board = [];
            let turn = 'w';
            let selectedRow = -1;
            let selectedCol = -1;
            let validMoves = [];
            let gameOver = false;
            let winner = null;
            let flipped = false;
            let mustContinueRow = -1;
            let mustContinueCol = -1;

            // ---------- 棋盘初始化 ----------
            function initBoard() {
                const b = [];
                for (let r = 0; r < 10; r++) {
                    b[r] = [];
                    for (let c = 0; c < 10; c++) {
                        if ((r + c) % 2 === 1) {
                            if (r < 4) b[r][c] = 'b';
                            else if (r > 5) b[r][c] = 'w';
                            else b[r][c] = null;
                        } else {
                            b[r][c] = null;
                        }
                    }
                }
                return b;
            }

            // ---------- 工具函数 ----------
            function isOnBoard(r, c) { return r >= 0 && r < 10 && c >= 0 && c < 10; }
            function isDark(r, c) { return (r + c) % 2 === 1; }
            function isColor(piece, color) { if (!piece) return false; return piece.toLowerCase() === color; }
            function isEnemy(piece, color) { if (!piece) return false; return piece.toLowerCase() !== color; }
            function isKing(piece) { return piece === 'W' || piece === 'B'; }
            function isMine(piece, color) { return piece && piece.toLowerCase() === color; }
            function cloneBoard(b) { return b.map(row => [...row]); }

            // ---------- 走法生成核心 ----------
            function getRawMovesForPiece(b, row, col) {
                const piece = b[row][col];
                if (!piece) return [];
                const color = piece.toLowerCase();
                const moves = [];

                // ---- 兵 ----
                if (!isKing(piece)) {
                    const forward = color === 'w' ? -1 : 1;
                    // 普通走法
                    const nr = row + forward;
                    if (isOnBoard(nr, col - 1) && isDark(nr, col - 1) && b[nr][col - 1] === null) {
                        moves.push({ toRow: nr, toCol: col - 1, captured: [], isCapture: false });
                    }
                    if (isOnBoard(nr, col + 1) && isDark(nr, col + 1) && b[nr][col + 1] === null) {
                        moves.push({ toRow: nr, toCol: col + 1, captured: [], isCapture: false });
                    }
                    // 吃子 (可前后)
                    const dirs = [-1, 1];
                    for (let dr of dirs) {
                        for (let dc of dirs) {
                            const midR = row + dr,
                                midC = col + dc;
                            const endR = row + 2 * dr,
                                endC = col + 2 * dc;
                            if (!isOnBoard(endR, endC) || !isDark(endR, endC)) continue;
                            const mid = b[midR][midC];
                            if (mid && isEnemy(mid, color) && b[endR][endC] === null) {
                                moves.push({ toRow: endR, toCol: endC, captured: [{ r: midR, c: midC }], isCapture: true });
                            }
                        }
                    }
                }

                // ---- 王 ----
                if (isKing(piece)) {
                    const dirs = [-1, 1];
                    // 普通滑行
                    for (let dr of dirs) {
                        for (let dc of dirs) {
                            let r = row + dr,
                                c = col + dc;
                            while (isOnBoard(r, c) && isDark(r, c) && b[r][c] === null) {
                                moves.push({ toRow: r, toCol: c, captured: [], isCapture: false });
                                r += dr;
                                c += dc;
                            }
                        }
                    }
                    // 吃子滑跳
                    for (let dr of dirs) {
                        for (let dc of dirs) {
                            let r = row + dr,
                                c = col + dc;
                            let foundEnemy = false,
                                enemyR = -1,
                                enemyC = -1;
                            while (isOnBoard(r, c) && isDark(r, c)) {
                                const current = b[r][c];
                                if (current !== null) {
                                    if (isEnemy(current, color)) {
                                        enemyR = r;
                                        enemyC = c;
                                        foundEnemy = true;
                                    } else {
                                        break; // 己方棋子挡住
                                    }
                                    break;
                                }
                                r += dr;
                                c += dc;
                            }
                            if (foundEnemy) {
                                let landR = enemyR + dr,
                                    landC = enemyC + dc;
                                while (isOnBoard(landR, landC) && isDark(landR, landC) && b[landR][landC] === null) {
                                    moves.push({
                                        toRow: landR,
                                        toCol: landC,
                                        captured: [{ r: enemyR, c: enemyC }],
                                        isCapture: true
                                    });
                                    landR += dr;
                                    landC += dc;
                                }
                            }
                        }
                    }
                }
                return moves;
            }

            // 获取某方所有走法 (若指定棋子则只返回该棋子走法)
            function getLegalMoves(b, color, specificR, specificC) {
                let allMoves = [];
                if (specificR !== undefined && specificR >= 0) {
                    // 只取指定棋子的走法（包括普通和吃子）
                    const raw = getRawMovesForPiece(b, specificR, specificC);
                    for (let m of raw) {
                        m.fromRow = specificR;
                        m.fromCol = specificC;
                        allMoves.push(m);
                    }
                    return allMoves;
                }

                // 全局所有棋子
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 10; c++) {
                        const p = b[r][c];
                        if (p && p.toLowerCase() === color) {
                            const raw = getRawMovesForPiece(b, r, c);
                            for (let m of raw) {
                                m.fromRow = r;
                                m.fromCol = c;
                                allMoves.push(m);
                            }
                        }
                    }
                }
                return allMoves;
            }

            // 过滤出强制吃子走法（如果有吃子，则只返回吃子）
            function filterMandatoryCaptures(moves) {
                const caps = moves.filter(m => m.isCapture);
                if (caps.length > 0) return caps;
                return moves;
            }

            // ---------- 执行走法 ----------
            function executeMove(b, move) {
                const { fromRow, fromCol, toRow, toCol, captured } = move;
                const piece = b[fromRow][fromCol];
                b[toRow][toCol] = piece;
                b[fromRow][fromCol] = null;
                for (let cap of captured) {
                    b[cap.r][cap.c] = null;
                }
                let promoted = false;
                if (piece === 'w' && toRow === 0) { b[toRow][toCol] = 'W';
                    promoted = true; }
                if (piece === 'b' && toRow === 9) { b[toRow][toCol] = 'B';
                    promoted = true; }
                return {
                    promoted,
                    newPiece: b[toRow][toCol],
                    row: toRow,
                    col: toCol,
                    isCapture: move.isCapture
                };
            }

            // ---------- 检查游戏结束 ----------
            function checkGameOver(b, color) {
                const moves = getLegalMoves(b, color);
                if (moves.length === 0) return true;
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 10; c++) {
                        if (b[r][c] && b[r][c].toLowerCase() === color) return false;
                    }
                }
                return true;
            }

            // ---------- 走一步 (UI 入口) ----------
            function makeMove(move) {
                if (gameOver) return false;
                const color = turn;
                const result = executeMove(board, move);

                if (move.isCapture) {
                    // 检查是否可继续连吃
                    const newRow = result.row,
                        newCol = result.col;
                    const newPiece = board[newRow][newCol];
                    if (newPiece && newPiece.toLowerCase() === color) {
                        const raw = getRawMovesForPiece(board, newRow, newCol);
                        const moreCaps = raw.filter(m => m.isCapture);
                        if (moreCaps.length > 0) {
                            mustContinueRow = newRow;
                            mustContinueCol = newCol;
                            selectedRow = newRow;
                            selectedCol = newCol;
                            validMoves = moreCaps.map(m => {
                                m.fromRow = newRow;
                                m.fromCol = newCol;
                                return m;
                            });
                            renderBoard();
                            return true;
                        }
                    }
                }

                // 切换回合
                mustContinueRow = -1;
                mustContinueCol = -1;
                turn = (turn === 'w' ? 'b' : 'w');
                if (checkGameOver(board, turn)) {
                    gameOver = true;
                    winner = (turn === 'w' ? 'b' : 'w');
                    renderBoard();
                    return true;
                }
                selectedRow = -1;
                selectedCol = -1;
                validMoves = [];
                renderBoard();
                return true;
            }

            // ---------- 渲染 ----------
            function renderBoard() {
                boardEl.innerHTML = '';
                const rows = [];
                for (let r = 0; r < 10; r++) rows.push(r);
                if (flipped) rows.reverse();

                for (let r of rows) {
                    for (let c = 0; c < 10; c++) {
                        const sq = document.createElement('div');
                        const isLight = (r + c) % 2 === 0;
                        sq.className = `square ${isLight ? 'light' : 'dark'}`;
                        if (!isLight) {
                            const piece = board[r][c];
                            if (piece) sq.textContent = SYMBOLS[piece] || '';
                            if (selectedRow === r && selectedCol === c) sq.classList.add('selected');
                            for (let m of validMoves) {
                                if (m.toRow === r && m.toCol === c) {
                                    sq.classList.add(m.isCapture ? 'valid-move-capture' : 'valid-move');
                                }
                            }
                            sq.addEventListener('click', (function(row, col) {
                                return function() { handleSquareClick(row, col); };
                            })(r, c));
                        } else {
                            sq.style.cursor = 'default';
                        }
                        boardEl.appendChild(sq);
                    }
                }
                updateStatus();
            }

            function updateStatus() {
                if (gameOver) {
                    statusEl.textContent = `🏆 ${winner === 'w' ? '白方' : '黑方'} 胜利！`;
                    return;
                }
                if (mustContinueRow >= 0) {
                    statusEl.textContent = `⏳ ${turn === 'w' ? '白方' : '黑方'} 继续连吃！`;
                    return;
                }
                statusEl.textContent = `⚪ ${turn === 'w' ? '白方' : '黑方'}走棋`;
            }

            // ---------- 点击处理 ----------
            function handleSquareClick(row, col) {
                if (gameOver) return;
                if (!isDark(row, col)) return;

                // 连吃模式
                if (mustContinueRow >= 0 && mustContinueCol >= 0) {
                    const move = validMoves.find(m => m.toRow === row && m.toCol === col);
                    if (move) {
                        const fullMove = {
                            fromRow: mustContinueRow,
                            fromCol: mustContinueCol,
                            toRow: move.toRow,
                            toCol: move.toCol,
                            captured: move.captured || [],
                            isCapture: true
                        };
                        makeMove(fullMove);
                    }
                    return;
                }

                const piece = board[row][col];
                if (!piece) {
                    // 空位：尝试执行走法
                    const move = validMoves.find(m => m.toRow === row && m.toCol === col);
                    if (move) {
                        const fullMove = {
                            fromRow: selectedRow,
                            fromCol: selectedCol,
                            toRow: move.toRow,
                            toCol: move.toCol,
                            captured: move.captured || [],
                            isCapture: move.isCapture || false
                        };
                        makeMove(fullMove);
                    } else {
                        selectedRow = -1;
                        selectedCol = -1;
                        validMoves = [];
                        renderBoard();
                    }
                    return;
                }

                // 点击己方棋子
                if (piece.toLowerCase() === turn) {
                    // 获取该棋子的所有走法
                    let moves = getLegalMoves(board, turn, row, col);
                    // 强制吃子：检查全局是否有吃子走法
                    const allMoves = getLegalMoves(board, turn);
                    const hasAnyCapture = allMoves.some(m => m.isCapture);
                    if (hasAnyCapture) {
                        // 只保留吃子走法
                        moves = moves.filter(m => m.isCapture);
                    }
                    if (moves.length > 0) {
                        selectedRow = row;
                        selectedCol = col;
                        validMoves = moves;
                    } else {
                        // 该棋子无合法走法，取消选中
                        selectedRow = -1;
                        selectedCol = -1;
                        validMoves = [];
                    }
                    renderBoard();
                } else {
                    // 点击对方棋子，取消选中
                    selectedRow = -1;
                    selectedCol = -1;
                    validMoves = [];
                    renderBoard();
                }
            }

            // ---------- 重置 ----------
            function resetGame() {
                board = initBoard();
                turn = 'w';
                selectedRow = -1;
                selectedCol = -1;
                validMoves = [];
                gameOver = false;
                winner = null;
                mustContinueRow = -1;
                mustContinueCol = -1;
                renderBoard();
            }

            // ---------- 翻转 ----------
            function flipBoard() {
                flipped = !flipped;
                renderBoard();
            }

            // ---------- 事件绑定 ----------
            btnReset.addEventListener('click', resetGame);
            btnFlip.addEventListener('click', flipBoard);

            // ---------- 启动 ----------
            board = initBoard();
            renderBoard();
            statusEl.textContent = '⚪ 白方走棋';
        })();
    </script>
